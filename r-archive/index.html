  <style>
    :root {

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);

    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    .topbar {
      padding: 22px 0 14px;

    .meta { margin: 0; color: var(--muted); font-size: .95rem; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      padding: 10px 0 28px;
    }
    .gallery-thumb {
      display: block;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel-strong);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      aspect-ratio: 1 / 1;
    }
    .gallery-thumb:hover { transform: translateY(-2px); border-color: #d7c8b7; box-shadow: 0 18px 36px rgba(56, 45, 33, .09); }
    .gallery-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
    @media (max-width: 720px) {
      .container { padding: 0 14px; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 8px; }
      .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

    const grid = document.getElementById('gallery-grid');
    for (const plot of plots) {
      const link = document.createElement('a');
      link.className = 'gallery-thumb';
      link.href = `plot/?id=${plot.id}`;
      link.setAttribute('aria-label', `Open ${plot.title}`);

      const img = document.createElement('img');
      img.src = `assets/${plot.image.split('/').pop()}`;
      img.alt = plot.alt || plot.title;
      img.loading = 'lazy';

      link.appendChild(img);
      grid.appendChild(link);
    }
  </script>
